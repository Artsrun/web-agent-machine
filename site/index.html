<!DOCTYPE html>
<html lang="en" data-theme="mask">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Agent Machine — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --wafer: #0E1120; --substrate: #161A2E; --substrate2: #1C2138; --etch: #2A3050;
  --silk: #E6E8F4; --dim: #7C86A8; --dimmer: #4E5677;
  --l-intent: #F5A524; --l-kernel: #4FD6C4; --l-policy: #FF5C5C; --l-conc: #7B9CFF;
  --l-wasm: #B080FF; --l-store: #5FD68A; --l-gfx: #FF4FA3;
  --font-display: "IBM Plex Sans Condensed", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --rail: 1px; --gap: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 90% at 50% -10%, #171C34 0%, transparent 60%), var(--wafer);
  color: var(--silk); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.shell { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; gap: var(--gap); padding: var(--gap); max-width: 1680px; margin-inline: auto; }
.panel { background: var(--substrate); border: var(--rail) solid var(--etch); min-height: 0; }
.rail { display: flex; align-items: center; gap: 20px; padding: 10px 14px; flex-wrap: wrap; }
.mark { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
.mark span { color: var(--l-kernel); }
.rev { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
.main { display: grid; grid-template-columns: 1fr; gap: var(--gap); min-height: 0; }
.bus { padding: 0; overflow: hidden; }
.bus header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: var(--rail) solid var(--etch); }
.bus ol { list-style: none; margin: 0; padding: 8px 14px; font-family: var(--font-mono); font-size: 11.5px; height: 200px; overflow-y: auto; display: flex; flex-direction: column-reverse; justify-content: flex-end; }
.bus li { display: flex; gap: 14px; padding: 1px 0; color: var(--dim); white-space: nowrap; }
.bus li b { color: var(--c, var(--l-kernel)); font-weight: 500; width: 74px; flex: none; }
.bus li time { color: var(--dimmer); flex: none; }
.bus li em { font-style: normal; color: var(--silk); }
.eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dimmer); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--l-store); box-shadow: 0 0 8px var(--l-store); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
#cmd { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--etch); background: var(--substrate); }
#cmd-input { flex: 1; background: var(--wafer); border: 1px solid var(--etch); color: var(--silk); padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; outline: none; }
#cmd button { background: var(--l-kernel); color: #0E1120; border: 0; padding: 8px 16px; font-family: var(--font-mono); font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="shell">
  <div class="panel rail">
    <div class="mark">Web Agent <span>Machine</span></div>
    <div class="rev">rev 0.2 · <span id="clock">--:--:--</span> · <span id="mode" style="color:var(--l-store)">LIVE</span></div>
  </div>
  <div class="main">
    <section class="panel bus" aria-label="Event bus">
      <header><span class="pulse"></span><span class="eyebrow">Event bus — live Kernel</span></header>
      <ol id="bus"></ol>
    </section>
  </div>
</div>
<script type="module">
const LAYERS = { intent: { color: 'var(--l-intent)' }, kernel: { color: 'var(--l-kernel)' }, policy: { color: 'var(--l-policy)' }, conc: { color: 'var(--l-conc)' }, wasm: { color: 'var(--l-wasm)' }, store: { color: 'var(--l-store)' }, gfx: { color: 'var(--l-gfx)' } };
const q = (id) => document.getElementById(id);
class EventBus {
  constructor() { this.handlers = new Map(); this.all = new Set(); }
  on(type, h) { if (type === '*') { this.all.add(h); return () => this.all.delete(h); } if (!this.handlers.has(type)) this.handlers.set(type, new Set()); this.handlers.get(type).add(h); return () => this.handlers.get(type)?.delete(h); }
  async emit(ev) { const tasks = []; for (const h of this.handlers.get(ev.type) || []) tasks.push(Promise.resolve(h(ev))); for (const h of this.all) tasks.push(Promise.resolve(h(ev))); await Promise.all(tasks); }
}
class CapabilityBroker {
  constructor() {
    this.registry = new Map([['filesystem.read',{risk:'low'}],['filesystem.list',{risk:'low'}],['filesystem.write',{risk:'medium'}],['browser.navigate',{risk:'high',requiresHITL:true}],['browser.click',{risk:'high',requiresHITL:true}]]);
    this.grants = new Map(); this.handlers = new Map(); this.approved = new Map();
  }
  handle(cap, fn) { this.handlers.set(cap, fn); }
  grant(g) { const list = this.grants.get(g.principal) || []; list.push(g); this.grants.set(g.principal, list); }
  approve(principal, cap) { if (!this.approved.has(principal)) this.approved.set(principal, new Set()); this.approved.get(principal).add(cap); }
  async request(req) {
    const def = this.registry.get(req.capability);
    if (!def) return { ok: false, error: 'unknown capability' };
    const has = (this.grants.get(req.principal) || []).some(g => g.capability === req.capability);
    if (!has) return { ok: false, error: 'no grant', requiresHITL: def.risk === 'high' };
    const needs = def.risk === 'high' || def.requiresHITL;
    const okHITL = this.approved.get(req.principal)?.has(req.capability);
    if (needs && !okHITL) return { ok: false, error: 'HITL required', requiresHITL: true };
    if (okHITL) this.approved.get(req.principal).delete(req.capability);
    const h = this.handlers.get(req.capability);
    return h ? h(req) : { ok: true, result: { echoed: req.args } };
  }
}
class FileAgent {
  constructor(seed = {}) { this.store = new Map(Object.entries(seed)); }
  handlers = {
    'filesystem.read': async (req) => { const path = req.args?.path || '/'; if (!this.store.has(path)) return { ok: false, error: 'ENOENT' }; return { ok: true, result: this.store.get(path) }; },
    'filesystem.list': async () => ({ ok: true, result: [...this.store.keys()] }),
    'filesystem.write': async (req) => { const { path, content } = req.args || {}; if (!path) return { ok: false, error: 'path required' }; this.store.set(path, content ?? ''); return { ok: true, result: { written: path } }; },
  };
}
class BrowserAgent {
  constructor() { this.url = 'about:blank'; this.history = []; }
  handlers = {
    'browser.navigate': async (req) => { const url = req.args?.url; if (!url) return { ok: false, error: 'url required' }; this.url = url; this.history.push({ action: 'navigate', url }); return { ok: true, result: { navigated: true, url } }; },
    'browser.click': async (req) => { const sel = req.args?.selector; if (!sel) return { ok: false, error: 'selector required' }; this.history.push({ action: 'click', selector: sel }); return { ok: true, result: { clicked: sel } }; },
  };
}
function plan(text) {
  const lower = text.toLowerCase(); const id = () => crypto.randomUUID();
  if (/write|save|create/.test(lower) && /file/.test(lower)) return [{ id: id(), description: 'Write file', capability: 'filesystem.write', args: { path: '/notes.txt', content: 'hello from agent' } }];
  if (/list|ls|dir/.test(lower)) return [{ id: id(), description: 'List directory', capability: 'filesystem.list', args: { path: '/' } }];
  if (/read|open|show|cat/.test(lower) && /file|notes/.test(lower)) return [{ id: id(), description: 'Read file', capability: 'filesystem.read', args: { path: '/notes.txt' } }];
  if (/navigate|go to|open url|browse/.test(lower)) return [{ id: id(), description: 'Navigate browser', capability: 'browser.navigate', args: { url: 'https://example.com' } }];
  return [{ id: id(), description: 'Acknowledge intent (no tool)' }];
}
class Kernel {
  constructor() {
    this.bus = new EventBus(); this.broker = new CapabilityBroker(); this.principal = 'desktop-agent';
    this.router = (t) => (/architect|refactor|multi-step|plan/i.test(t) ? '8b' : '6b');
    this.fallbacks = [
      { from: 'browser.navigate', to: 'filesystem.write', mapArgs: () => ({ path: '/nav-fallback.txt', content: 'navigate was blocked — logged instead' }), reason: 'navigate denied/failed → log to file' },
      { from: 'browser.click', to: 'filesystem.write', mapArgs: (args) => ({ path: '/click-fallback.txt', content: `click blocked: ${JSON.stringify(args)}` }), reason: 'click denied/failed → log to file' },
    ];
  }
  grant(cap) { this.broker.grant({ capability: cap, principal: this.principal }); }
  approve(cap) { this.broker.approve(this.principal, cap); }
  registerAgent(handlers) { for (const [cap, fn] of Object.entries(handlers)) this.broker.handle(cap, fn); }
  async handleIntent(text) {
    const intent = { id: crypto.randomUUID(), text, timestamp: Date.now() };
    await this.bus.emit({ type: 'intent', payload: intent });
    const model = this.router(text); const steps = plan(text);
    const planObj = { id: crypto.randomUUID(), intentId: intent.id, steps, model };
    await this.bus.emit({ type: 'plan', payload: planObj });
    for (const step of steps) { if (!step.capability) continue; const stopped = await this.executeWithFallback(step.capability, step.args || {}); if (stopped) break; }
    return { intent, plan: planObj, model };
  }
  async executeWithFallback(capability, args, depth = 0) {
    if (depth > 2) return true;
    const callId = crypto.randomUUID();
    await this.bus.emit({ type: 'tool_call', payload: { id: callId, capability, args, principal: this.principal } });
    const result = await this.broker.request({ requestId: callId, capability, args, principal: this.principal });
    await this.bus.emit({ type: 'tool_result', payload: { callId, ok: result.ok, result: result.ok ? result.result : undefined, error: result.ok ? undefined : result.error } });
    if (result.ok) return false;
    if (result.requiresHITL) { await this.bus.emit({ type: 'error', payload: { code: 'HITL_REQUIRED', message: `Human approval needed for ${capability}`, recoverable: true, capability, args } }); return true; }
    const rule = this.fallbacks.find((f) => f.from === capability);
    if (rule) { await this.bus.emit({ type: 'error', payload: { code: 'FALLBACK', message: rule.reason || `${capability} → ${rule.to}`, recoverable: true, capability, fallbackTo: rule.to } }); return this.executeWithFallback(rule.to, rule.mapArgs ? rule.mapArgs(args) : args, depth + 1); }
    await this.bus.emit({ type: 'error', payload: { code: 'TOOL_FAILED', message: result.error || `${capability} failed`, recoverable: false, capability } }); return false;
  }
}
const files = new FileAgent({ '/readme.md': '# Web Agent Machine' });
const browser = new BrowserAgent();
const kernel = new Kernel();
kernel.registerAgent(files.handlers); kernel.registerAgent(browser.handlers);
kernel.grant('filesystem.read'); kernel.grant('filesystem.list'); kernel.grant('filesystem.write');
kernel.grant('browser.navigate'); kernel.grant('browser.click');
const bus = q('bus');
const stamp = () => { const t = new Date(); return t.toTimeString().slice(0, 8) + '.' + String(t.getMilliseconds()).padStart(3, '0'); };
const pushBus = (src, ev, msg, layer = 'kernel') => {
  const li = document.createElement('li');
  li.style.setProperty('--c', LAYERS[layer]?.color || 'var(--l-kernel)');
  const time = document.createElement('time'); time.textContent = stamp();
  const b = document.createElement('b'); b.textContent = src;
  const em = document.createElement('em'); em.textContent = ev;
  const span = document.createElement('span'); span.textContent = msg;
  li.append(time, b, em, span);
  bus.prepend(li); while (bus.children.length > 40) bus.lastElementChild.remove();
};
kernel.bus.on('*', (e) => {
  switch (e.type) {
    case 'intent': pushBus('kernel', 'intent', e.payload.text.slice(0, 48), 'kernel'); break;
    case 'plan': pushBus('kernel', 'plan', `[${e.payload.model}] ` + e.payload.steps.map(s => s.description).join(' → '), 'kernel'); break;
    case 'tool_call': pushBus('mesh', 'tool_call', e.payload.capability, 'intent'); break;
    case 'tool_result': pushBus('broker', e.payload.ok ? 'grant' : 'deny', e.payload.ok ? JSON.stringify(e.payload.result).slice(0, 40) : e.payload.error, 'policy'); break;
    case 'error':
      if (e.payload.code === 'HITL_REQUIRED') { pushBus('broker', 'HITL', e.payload.message, 'policy'); showHITL(e.payload.capability, e.payload.args); }
      else if (e.payload.code === 'HITL_DENIED') { pushBus('broker', 'denied', e.payload.message, 'policy'); }
      else if (e.payload.code === 'FALLBACK') { pushBus('broker', 'fallback', e.payload.message, 'policy'); }
      else { pushBus('broker', 'error', e.payload.message || e.payload.code, 'policy'); }
      break;
  }
});
let pendingCap = null;
let pendingArgs = null;
const hitlBar = document.createElement('div');
hitlBar.style.cssText = 'display:none;padding:8px 14px;border-top:1px solid var(--etch);background:var(--substrate2);align-items:center;gap:10px;';
hitlBar.innerHTML = `<span class="eyebrow" style="color:var(--l-policy)">HITL required</span><span id="hitl-cap" style="font-family:var(--font-mono);font-size:12px;color:var(--silk)"></span><button id="hitl-approve" style="margin-left:auto;font-family:var(--font-mono);font-size:11px;padding:4px 12px;background:var(--l-policy);color:#fff;border:0;cursor:pointer">APPROVE</button><button id="hitl-deny" style="font-family:var(--font-mono);font-size:11px;padding:4px 12px;background:transparent;color:var(--dim);border:1px solid var(--etch);cursor:pointer">DENY</button>`;
document.querySelector('.bus').append(hitlBar);
function showHITL(cap, args) { pendingCap = cap; pendingArgs = args || {}; document.getElementById('hitl-cap').textContent = cap || ''; hitlBar.style.display = 'flex'; }
document.getElementById('hitl-approve').onclick = async () => {
  if (!pendingCap) return;
  const cap = pendingCap; const args = pendingArgs;
  kernel.approve(cap); pushBus('broker', 'approve', cap, 'policy'); hitlBar.style.display = 'none'; pendingCap = null; pendingArgs = null;
  await kernel.executeWithFallback(cap, args);
};
document.getElementById('hitl-deny').onclick = async () => {
  const cap = pendingCap; if (!cap) { hitlBar.style.display = 'none'; return; }
  await kernel.bus.emit({ type: 'error', payload: { code: 'HITL_DENIED', message: `Human denied capability: ${cap}`, recoverable: true, capability: cap } });
  pushBus('broker', 'deny', cap, 'policy'); hitlBar.style.display = 'none'; pendingCap = null;
  const rule = kernel.fallbacks.find((f) => f.from === cap);
  if (rule) { await kernel.bus.emit({ type: 'error', payload: { code: 'FALLBACK', message: rule.reason || `${cap} denied → ${rule.to}`, recoverable: true, capability: cap, fallbackTo: rule.to } }); await kernel.executeWithFallback(rule.to, rule.mapArgs ? rule.mapArgs({}) : {}, 1); }
};
const bar = document.createElement('form'); bar.id = 'cmd';
bar.innerHTML = `<input id="cmd-input" placeholder="write a file… / read the notes file… / list… / navigate to…" /><button type="submit">SEND</button>`;
document.querySelector('.shell').append(bar);
bar.addEventListener('submit', async (e) => { e.preventDefault(); const input = document.getElementById('cmd-input'); const text = input.value.trim(); if (!text) return; input.value = ''; input.disabled = true; try { await kernel.handleIntent(text); } finally { input.disabled = false; input.focus(); } });
setInterval(() => { q('clock').textContent = new Date().toTimeString().slice(0, 8); }, 1000);
pushBus('kernel', 'boot', 'Kernel + FileAgent + BrowserAgent live', 'kernel');
</script>
</body>
</html>
