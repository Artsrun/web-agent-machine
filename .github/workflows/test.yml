name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The kernel is DOM-free, so its types and semantics can be checked in
  # seconds on every branch without downloading a browser.
  check:
    name: typecheck + kernel units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  ui:
    name: browser tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
